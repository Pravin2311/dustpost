<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us | DustPost</title>

<style>
body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: #0f1115;
    color: #e6e6e6;
}
.container {
    max-width: 700px;
    margin: auto;
    padding: 40px 20px;
}
h1 { font-size: 30px; }

form {
    margin-top: 20px;
}

input, textarea {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border-radius: 8px;
    border: none;
    background: #1a1d24;
    color: #fff;
}

button {
    padding: 12px 20px;
    background: #4da3ff;
    border: none;
    border-radius: 8px;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #3390ff;
}

.logo {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 1px;
}

.logo span {
    color: #4da3ff;
}

.nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 40px;
    border-bottom: 1px solid #1f2229;
}

.nav a {
    color: #aaa;
    text-decoration: none;
    margin-left: 20px;
    font-size: 14px;
}

.nav a:hover {
    color: #fff;
}
</style>
</head>

<body>

    <div class="nav">
    <div class="logo">Dust<span>Post</span></div>
<div>
    <a href="/">Home</a>
    <a href="story/index.html">Explore</a>
    </div>
</div>

<div class="container">

<h1>Contact Us</h1>

<p>Have a question, feedback, or collaboration request? Reach out below.</p>

<form>
    <input type="text" placeholder="Your Name" required>
    <input type="email" placeholder="Your Email" required>
    <textarea rows="5" placeholder="Your Message"></textarea>
    <button type="submit">Send Message</button>
</form>

<p style="margin-top:20px;">
Or email us directly: <strong>contact@dustpost.com</strong>
</p>

</div>

</body>
</html>
