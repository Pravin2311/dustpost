<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Explore Stories | DustPost</title>
<meta name="description" content="Explore global news, economy insights, and deep analysis on DustPost.">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

/* GLOBAL */
body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: #0f1115;
    color: #e6e6e6;
}

/* NAV */
.nav {
    display: flex;
    justify-content: space-between;
    padding: 20px 40px;
    border-bottom: 1px solid #1f2229;
}

.logo {
    font-weight: 700;
    font-size: 20px;
}

.logo span {
    color: #4da3ff;
}

.nav a {
    color: #aaa;
    text-decoration: none;
    margin-left: 20px;
}

/* HEADER */
.header {
    text-align: center;
    padding: 60px 20px 30px;
}

.header h1 {
    font-size: 34px;
}

.header p {
    color: #888;
}

/* GRID */
.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 25px;
}

/* CARD */
.card {
    background: #161a22;
    border-radius: 14px;
    overflow: hidden;
    transition: 0.3s;
    cursor: pointer;
}

.card:hover {
    transform: translateY(-5px);
    background: #1c212b;
}

.card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
}

.card-content {
    padding: 15px;
}

.card h3 {
    font-size: 18px;
    margin-bottom: 10px;
}

.card p {
    font-size: 14px;
    color: #aaa;
}

.meta {
    font-size: 12px;
    color: #777;
    margin-top: 10px;
}

/* FOOTER */
.footer {
    text-align: center;
    padding: 30px;
    border-top: 1px solid #1f2229;
    margin-top: 40px;
    color: #777;
}

</style>
</head>

<body>

<!-- NAV -->
<div class="nav">
    <div class="logo">Dust<span>Post</span></div>
    <div>
        <a href="/">Home</a>
    </div>
</div>

<!-- HEADER -->
<div class="header">
    <h1>Explore Stories</h1>
    <p>Global news, explained simply.</p>
</div>

<!-- BLOG GRID -->
<div class="container">
    <div class="grid" id="blogContainer"></div>
</div>

<!-- FOOTER -->
<div class="footer">
    © 2026 DustPost — Clarity Beyond Headlines
</div>

<script>

/* BLOG DATA (ADD ARTICLES HERE) */
const posts = [
    {
        title: "Iran Tightens Grip on Strait of Hormuz",
        description: "A major shift in global oil trade and geopolitics explained simply.",
        image: "/images/hormuz-hero.jpg",
        link: "strait-of-hormuz-control.html",
        date: "March 31, 2026"
    },
    {
        title: "India Economy 2026: Inflation Surge, FII Exit & Oil Shock Risks",
        description: "Iran-US war impact, rupee fall, rising inflation, and widening deficit—complete breakdown of India’s economic outlook.",
        image: "/images/inr-chart.jpg",
        link: "indian-2026-economic-outlook.html",
        date: "March 30, 2026"
    }, 
    {
        title: "Iran–US War: Strategy Shift & Global Oil Risk",
        description: "US signals exit while Iran gains leverage through oil disruption and economic pressure.",
        image: "/images/iran-war.jpg",
        link: "/story/iran-us-war-analysis.html",
        date: "March 29, 2026"
    },
    {
        title: "Trump Warns Allies Amid Iran War Oil Crisis",
        description: "US signals shift in alliances as oil disruption in Hormuz impacts global markets.",
        image: "/images/trump-allies.jpg",
        link: "/story/trump-warns-allies-on-oil-supply.html",
        date: "March 28, 2026"
    }
];

/* RENDER POSTS */
const container = document.getElementById("blogContainer");

posts.forEach(post => {
    const card = document.createElement("div");
    card.className = "card";
    card.onclick = () => window.location.href = post.link;

    card.innerHTML = `
        <img src="${post.image}" alt="${post.title}">
        <div class="card-content">
            <h3>${post.title}</h3>
            <p>${post.description}</p>
            <div class="meta">${post.date}</div>
        </div>
    `;

    container.appendChild(card);
});

</script>

</body>
</html>
