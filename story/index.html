<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Explore Stories | DustPost</title>
<meta name="description" content="Explore global news, economy insights, and deep analysis on DustPost.">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

/* GLOBAL */
body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: #0f1115;
    color: #e6e6e6;
}

/* NAV */
.nav {
    display: flex;
    justify-content: space-between;
    padding: 20px 40px;
    border-bottom: 1px solid #1f2229;
}

.logo {
    font-weight: 700;
    font-size: 40px;
}

.logo span {
    color: #4da3ff;
}

.nav a {
    color: #aaa;
    text-decoration: none;
    margin-left: 20px;
}

/* HEADER */
.header {
    text-align: center;
    padding: 60px 20px 30px;
}

.header h1 {
    font-size: 34px;
}

.header p {
    color: #888;
}

/* GRID */
.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 25px;
}

/* CARD */
.card {
    background: #161a22;
    border-radius: 14px;
    overflow: hidden;
    transition: 0.3s;
    cursor: pointer;
}

.card:hover {
    transform: translateY(-5px);
    background: #1c212b;
}

.card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
}

.card-content {
    padding: 15px;
}

.card h3 {
    font-size: 18px;
    margin-bottom: 10px;
}

.card p {
    font-size: 14px;
    color: #aaa;
}

.meta {
    font-size: 12px;
    color: #777;
    margin-top: 10px;
}

/* FOOTER */
.footer {
    text-align: center;
    padding: 30px;
    border-top: 1px solid #1f2229;
    margin-top: 40px;
    color: #777;
}

/* SECTION TITLE */
.section-title {
    font-size: 20px;
    margin: 30px 0 15px;
    color: #fff;
}

/* LATEST (BIG CARDS) */
.latest-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 25px;
}

.latest-card {
    background: #161a22;
    border-radius: 14px;
    overflow: hidden;
    transition: 0.3s;
    cursor: pointer;
}

.latest-card img {
    height: 200px;
    width: 100%;
    object-fit: cover;
}

.latest-card-content {
    padding: 16px;
}

.latest-card h3 {
    font-size: 18px;
    margin-bottom: 10px;
}

.latest-card p {
    font-size: 14px;
    color: #aaa;
}

/* MORE (COMPACT GRID) */
.more-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 15px;
}

.more-card {
    display: flex;
    gap: 10px;
    background: transparent;
    cursor: pointer;
    padding: 10px;
    border-radius: 8px;
    transition: 0.2s;
}

.more-card:hover {
    background: #1c212b;
}

.more-card img {
    width: 100px;
    height: 70px;
    object-fit: cover;
    border-radius: 6px;
}

.more-card-content h4 {
    font-size: 14px;
    margin: 0 0 5px;
}

.more-card-content p {
    font-size: 12px;
    color: #888;
}
/* MID SIZE (for page 2+) */
.mid-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 18px;
}

.mid-card {
    background: #161a22;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: 0.3s;
}

.mid-card:hover {
    transform: translateY(-4px);
    background: #1c212b;
}

.mid-card img {
    width: 100%;
    height: 140px;
    object-fit: cover;
}

.mid-card-content {
    padding: 12px;
}

.mid-card h3 {
    font-size: 15px;
    margin-bottom: 6px;
}

.mid-card p {
    font-size: 12px;
    color: #888;
}
</style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-ZDDC7TT26T"></script>

  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-ZDDC7TT26T');
</script>
</head>

<body>

<!-- NAV -->
<div class="nav">
    <div class="logo">Dust<span>Post.com</span></div>
    <div>
        <a href="/">Home</a>
    </div>
</div>

<!-- HEADER -->
<div class="header">
    <h1>Explore Stories</h1>
    <p>Global news, explained simply.</p>
</div>

<!-- BLOG GRID -->
<div class="container">
 
<h2 class="section-title" id="latestTitle">Latest Stories</h2>
<div class="latest-grid" id="latestContainer"></div>

<h2 class="section-title" id="moreTitle">More Stories</h2>
<div class="more-grid" id="moreContainer"></div>

<div id="pagination" style="text-align:center; margin:30px 0;"></div>

</div>

<!-- FOOTER -->
<div class="footer">
    © 2026 DustPost — Clarity Beyond Headlines
</div>

<script>

/* BLOG DATA (ADD ARTICLES HERE) */
const posts = [
    {
        title: "Iran’s Open Letter to Americans: What It Really Means",
        description: "Beyond peace—inside Iran’s strategy, messaging, and global impact.",
        image: "/images/iran-letter-thumbnail.jpg",
        link: "iran-letter-to-americans.html",
        date: "April 2, 2026"
    },
    {
        title: "Fuel Prices Surge in India: Diesel Up ₹25/Litre",
        description: "Nayara and Shell hike petrol and diesel prices sharply amid global oil shock.",
        image: "/images/fuel-price.jpg",
        link: "petrol-diesel-price-hike-india.html",
        date: "April 1, 2026"
    },
    {
        title: "Vijaypat Singhania Passes Away at 87",
        description: "The man behind Raymond leaves behind a legacy woven into Indian lives.",
        image: "/images/singhania.jpg",
        link: "raymond-founder-vijaypat-singhania-passes-away-at-87.html",
        date: "April 1, 2026"
    },
    {
        title: "India's Banking Reset 2026: 8 New Rules That Could Cost You Lakhs",
        description: "RBI and Ministry of Finance introduce major banking changes from April 1, 2026. UPI ATM limits, PAN card rules, cash transaction thresholds—everything you must know to avoid penalties.",
        image: "/images/india-banking-2026.jpg",
        link: "new-rbi-rules-2026.html",
        date: "March 31, 2026"
    },
    {
        title: "HDFC in Crisis: Chairman's Ethical Exit Wipes $16 Billion",
        description: "Atanu Chakrabarti resigns as HDFC chairman citing ethical concerns. Market reacts sharply. What's behind India's banking storm? Full analysis.",
        image: "/images/hdfc-crisis-2026.jpg",
        link: "hdfc-crisis-16billion-wiped.html",
        date: "March 31, 2026"
    },
    {
        title: "Iran Tightens Grip on Strait of Hormuz",
        description: "A major shift in global oil trade and geopolitics explained simply.",
        image: "/images/hormuz-hero.jpg",
        link: "strait-of-hormuz-control.html",
        date: "March 30, 2026"
    },
    
    {
        title: "India Economy 2026: Inflation Surge, FII Exit & Oil Shock Risks",
        description: "Iran-US war impact, rupee fall, rising inflation, and widening deficit—complete breakdown of India’s economic outlook.",
        image: "/images/inr-chart.jpg",
        link: "indian-2026-economic-outlook.html",
        date: "March 30, 2026"
    }, 
    {
        title: "Iran–US War: Strategy Shift & Global Oil Risk",
        description: "US signals exit while Iran gains leverage through oil disruption and economic pressure.",
        image: "/images/iran-war.jpg",
        link: "iran-us-war-end-game.html",
        date: "March 29, 2026"
    },
    {
        title: "Trump Warns Allies Amid Iran War Oil Crisis",
        description: "US signals shift in alliances as oil disruption in Hormuz impacts global markets.",
        image: "/images/trump-allies.jpg",
        link: "trump-warns-allies-on-oil-supply.html",
        date: "March 28, 2026"
    },
    
];


/* RENDER POSTS */



/* CONFIG */
const LATEST_COUNT = 6;
const MORE_COUNT = 8;
const POSTS_PER_PAGE = 14;

let currentPage = 1;

posts.sort((a,b) => new Date(b.date) - new Date(a.date));

function renderPage(page) {

    const start = (page - 1) * POSTS_PER_PAGE;
    const end = start + POSTS_PER_PAGE;

    const pagePosts = posts.slice(start, end);

    const latestContainer = document.getElementById("latestContainer");
    const moreContainer = document.getElementById("moreContainer");

    const latestTitle = document.getElementById("latestTitle");

    latestContainer.innerHTML = "";
    moreContainer.innerHTML = "";

    // 👉 PAGE 1
    if (page === 1) {

        latestTitle.style.display = "block";

        /* LATEST */
        pagePosts.slice(0, LATEST_COUNT).forEach(post => {
            latestContainer.innerHTML += `
            <div class="latest-card" onclick="location.href='${post.link}'">
                <img src="${post.image}">
                <div class="latest-card-content">
                    <h3>${post.title}</h3>
                    <p>${post.description}</p>
                </div>
            </div>
            `;
        });

        /* MORE (SMALL) */
        moreContainer.className = "more-grid";

        pagePosts.slice(LATEST_COUNT).forEach(post => {
            moreContainer.innerHTML += `
            <div class="more-card" onclick="location.href='${post.link}'">
                <img src="${post.image}">
                <div class="more-card-content">
                    <h4>${post.title}</h4>
                    <p>${post.date}</p>
                </div>
            </div>
            `;
        });

    } 
    // 👉 PAGE 2+
    else {

        latestTitle.style.display = "none";
        latestContainer.innerHTML = "";

        /* MID SIZE GRID */
        moreContainer.className = "mid-grid";

        pagePosts.forEach(post => {
            moreContainer.innerHTML += `
            <div class="mid-card" onclick="location.href='${post.link}'">
                <img src="${post.image}">
                <div class="mid-card-content">
                    <h3>${post.title}</h3>
                    <p>${post.date}</p>
                </div>
            </div>
            `;
        });

    }
}

/* PAGINATION */
function renderPagination() {

    const totalPages = Math.ceil(posts.length / POSTS_PER_PAGE);
    const container = document.getElementById("pagination");

    container.innerHTML = "";

    if (currentPage > 1) {
        container.innerHTML += `<button onclick="goToPage(${currentPage - 1})">← Prev</button>`;
    }

    for (let i = 1; i <= totalPages; i++) {
        container.innerHTML += `
        <button onclick="goToPage(${i})">${i}</button>
        `;
    }

    if (currentPage < totalPages) {
        container.innerHTML += `<button onclick="goToPage(${currentPage + 1})">Next →</button>`;
    }
}

function goToPage(page) {
    currentPage = page;
    renderPage(page);
    renderPagination();
    window.scrollTo({ top: 0, behavior: "smooth" });
}

/* INIT */
renderPage(currentPage);
renderPagination();

</script>

</script>

</body>
</html>
